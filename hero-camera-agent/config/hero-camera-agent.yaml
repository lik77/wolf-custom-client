%YAML:1.0

# hero-camera-agent 启动配置
# 调参时优先改这个文件，然后统一用 --config 启动。
# 当前这份默认配置已经按“比赛优先流畅、低延迟、能看到托影”整理。

# 发送到 MCU 的串口设备，例如 /dev/ttyUSB0 或 /dev/ttyACM0
serial_device: "/dev/tty_robot"

# 串口波特率
baud_rate: 1500000

# 自研视频分片最大发包速率，单位 包/秒
# 调大：码流排队更少，延迟可能更低，但更容易把下游链路打满。
# 调小：链路更稳，但画面更容易积压、卡顿。
max_stream_packets_per_sec: 40

camera:
  # ---------------- 相机输入参数 ----------------

  # mvs / opencv / file
  source: "mvs"

  # 没填 device_serial 时，按枚举序号选择相机
  device_index: 0

  # 如果接了两台同型号海康相机，填写要固定读取那台的序列号
  # 留空时继续按 device_index 选择
  device_serial: ""

  # 本地视频联调时填写文件路径；如果只填这个路径，程序会自动切到 file 源
  video_path: ""

  # 曝光时间，单位微秒
  # 调大：画面更亮，暗处更容易看见，但拖影更重、延迟更高、流畅度更差。
  # 调小：延迟更低、更流畅，但画面更暗，需要配合 gain 使用。
  exposure_us: 12000

  # 手动增益，优先用于在较低曝光下抬高亮弹丸可见度
  # 调大：亮弹丸更容易被看见，但噪点会增加，误触发托影概率会上升。
  # 调小：画面更干净，但弹丸可能太暗。
  gain: 10.0

  # 相机采集帧率；编码帧率会自动跟随这个值
  # 调大：更流畅、弹丸轨迹更连续，但单帧进光时间更短，画面会更暗。
  # 调小：单帧更亮，但整体不流畅，运动目标更容易拖慢感知。
  fps: 60

preprocessor:
  # ---------------- 预处理与托影参数 ----------------

  # 编码前输出宽度
  # 调大：细节更多，但编码压力更大、码率更吃紧。
  # 调小：更流畅、更省码率，但细节更糊。
  output_width: 256

  # 编码前输出高度
  # 调大/调小效果同 output_width。
  output_height: 256

  # 中心区域保留比例，越大越偏向保留中心区域
  # 调大：中心清晰区域更大，更利于看准星附近。
  # 调小：整体模糊区域更多，更省信息量。
  center_keep_ratio: 0.33

  # 是否开启弹道拖影增强
  enable_trail: 1

  # 参与弹丸拖影的最小灰度亮度阈值，适用于白色高亮弹丸和绿色发光弹丸
  # 调大：只保留更亮的目标，误触发更少，但弹丸可能不够亮而丢托影。
  # 调小：更容易打出托影，但噪点和亮背景也更容易被带进去。
  trail_brightness_threshold: 135

  # 当运动像素占整张 ROI 超过该比例时，临时禁用拖影，避免大面积运动导致满屏拖花
  # 调大：更不容易禁用托影，激烈运动时也可能继续拖花。
  # 调小：更容易熔断托影，画面更干净，但也更容易错过短时弹道。
  trail_disable_motion_ratio: 0.06

  # 运动像素占比恢复正常后，连续多少帧低于阈值才重新开启拖影
  # 调大：恢复更稳，不容易反复闪烁，但恢复更慢。
  # 调小：恢复更快，但可能在复杂运动场景里来回抖动。
  trail_reenable_frames: 5

  # 拖影保留的历史帧数
  # 调大：托影更长、更明显，但更容易糊和脏。
  # 调小：托影更短、更干净，但存在感会下降。
  trail_history_frames: 5

encoder:
  # ---------------- 编码与传输参数 ----------------

  # 目标码率，单位 Byte/s
  # 调大：画质更稳、块效应更少，但更容易打满链路。
  # 调小：更省带宽、更稳，但画面更糊、更容易花屏。
  target_bytes_per_sec: 8000

  # 关键帧间隔，通常与 fps 接近
  # 调大：码率更省，但丢包后恢复更慢。
  # 调小：恢复更快，但关键帧更频繁、码率更高。
  gop: 30

  # 编码器名称，通常保持默认即可
  codec_name: "libx264"
